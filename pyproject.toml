[project]
name = "beads-hub"
version = "0.1.0"
description = "A shared Beads backlog for GitHub issues and pull requests"
requires-python = ">=3.11"
dependencies = ["beads-mcp==1.3.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "pyyaml>=6", "types-PyYAML>=6"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["scripts", "tests"]
