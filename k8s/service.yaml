apiVersion: v1
kind: Service
metadata:
  name: beads-hub-headless
spec:
  clusterIP: None
  selector:
    app: beads-hub
  ports:
    - name: dolt-sql
      port: 3307
      targetPort: dolt-sql
---
apiVersion: v1
kind: Service
metadata:
  name: beads-hub
spec:
  selector:
    app: beads-hub
  ports:
    - name: http-ui
      port: 3000
      targetPort: http-ui
    - name: http-mcp
      port: 8080
      targetPort: http-mcp
    - name: dolt-sql
      port: 3307
      targetPort: dolt-sql
