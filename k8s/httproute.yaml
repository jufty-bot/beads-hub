# Optional: configure an authenticated private Gateway before applying this file.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: beads-hub-routes
  namespace: beads-hub
spec:
  parentRefs:
    - name: main-gateway
      namespace: gateway-system
  hostnames: [beads.internal]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: beads-hub
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: beads-hub
          port: 3000
